<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Exposure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK (Realtime Database) — used to sync login groups across devices.
     Loads via CDN. If the config below is not filled in, the app falls back to
     local/on-device storage and still works. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg: #12151a;
    --panel: #191d24;
    --panel-2: #1f242c;
    --border: #2b313c;
    --border-soft: #232833;
    --text: #e8eaee;
    --text-dim: #838a99;
    --text-faint: #565d6b;
    --long: #59a37a;
    --short: #c4675a;
    --cover: #cf9f45;
    --warn: #cf9f45;
    --lp-broctagon: #4a90d9;
    --lp-fxgrow: #a866c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    min-height:100vh;
  }
  h1,h2,h3,.label,button,.tab{
    font-family:'Barlow Condensed', sans-serif;
  }
  .app{max-width:1240px;margin:0 auto;padding:28px 24px 60px;}

  /* header */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border);
    padding-bottom:18px;margin-bottom:22px;
    flex-wrap:wrap;gap:14px;
  }
  .titleblock h1{
    font-size:28px;font-weight:700;margin:0 0 2px;letter-spacing:0.2px;
    color:var(--text);
  }
  .titleblock .sub{color:var(--text-dim);font-size:13px;}
  .fileinfo{text-align:right;font-size:12px;color:var(--text-dim);line-height:1.6;}
  .fileinfo b{color:var(--text);font-weight:500;}

  .loadbtn{
    background:var(--cover);color:#1a1508;border:none;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
    padding:9px 18px;border-radius:2px;cursor:pointer;letter-spacing:0.3px;
  }
  .loadbtn:hover{filter:brightness(1.08);}
  input[type=file]{display:none;}

  /* tabs */
  .tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab{
    background:none;border:none;color:var(--text-dim);
    font-size:18px;font-weight:600;padding:8px 4px;margin-right:22px;
    cursor:pointer;border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--cover);}

  /* banner */
  .banner{
    border:1px solid var(--warn);background:rgba(207,159,69,0.08);
    color:var(--text);padding:10px 14px;margin-bottom:18px;
    font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .banner a{color:var(--cover);cursor:pointer;text-decoration:underline;}

  /* summary strip */
  .summary{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--border);flex-wrap:wrap;}
  .summary .cell{flex:1;min-width:120px;padding:12px 16px;border-right:1px solid var(--border-soft);}
  .summary .cell:last-child{border-right:none;}
  .summary .cell .label{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .summary .cell .val{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;}

  /* exposure table */
  table{width:100%;border-collapse:collapse;}
  .exposure-table thead th{
    text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;
    font-size:13px;color:var(--text-dim);letter-spacing:0.2px;
    border-bottom:1px solid var(--border);padding:8px 10px;
  }
  .exposure-table tbody tr{border-bottom:1px solid var(--border-soft);}
  .exposure-table td{padding:12px 10px;vertical-align:middle;}
  .symcell{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;}
  .num{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .num.long{color:var(--long);}
  .num.short{color:var(--short);}
  .num.zero{color:var(--text-dim);}
  .cover-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--border);padding:4px 8px;min-width:64px;text-align:center;
  }
  .chip .pct{font-size:10.5px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px;}
  .chip .val{font-size:12.5px;font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .chip.unassigned{border-color:var(--warn);border-style:dashed;}
  .chip.unassigned .pct{color:var(--warn);}
  .chip.lp-broctagon{border-left:3px solid var(--lp-broctagon);}
  .chip.lp-fxgrow{border-left:3px solid var(--lp-fxgrow);}

  .lp-tag{font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px;padding:2px 6px;border-radius:2px;display:inline-block;}
  .lp-tag.lp-broctagon{color:var(--lp-broctagon);border:1px solid var(--lp-broctagon);}
  .lp-tag.lp-fxgrow{color:var(--lp-fxgrow);border:1px solid var(--lp-fxgrow);}

  .empty{
    text-align:center;padding:70px 20px;color:var(--text-dim);
  }
  .empty .big{font-size:20px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:600;margin-bottom:8px;}

  /* groups tab */
  .groups-wrap{display:grid;grid-template-columns:1fr;gap:22px;}
  .panel{border:1px solid var(--border);background:var(--panel);}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;}
  .panel-head h3{margin:0;font-size:17px;font-weight:600;}
  .panel-body{padding:14px 16px;}

  .groups-table th{text-align:left;font-family:'Barlow Condensed',sans-serif;color:var(--text-dim);font-weight:600;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--border-soft);}
  .groups-table td{padding:7px 8px;border-bottom:1px solid var(--border-soft);}
  .groups-table input[type=text], .groups-table input[type=number]{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 7px;width:100%;
  }
  .groups-table input[type=number]{width:70px;}
  select{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 7px;
  }
  .groups-table select{width:100%;}
  .row-actions{display:flex;gap:8px;}
  .iconbtn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    font-family:'Barlow Condensed',sans-serif;font-size:12px;padding:4px 9px;cursor:pointer;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--text-dim);}
  .iconbtn.danger:hover{color:var(--short);border-color:var(--short);}

  .add-row{display:flex;gap:10px;align-items:flex-end;margin-top:12px;flex-wrap:wrap;}
  .add-row .field{display:flex;flex-direction:column;gap:4px;}
  .add-row .field label{font-size:11px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px;}
  .add-row input, .add-row select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:7px 9px;}
  .add-row .btn{
    background:var(--cover);color:#1a1508;border:none;font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:14px;padding:8px 16px;cursor:pointer;
  }
  .add-row .btn:disabled{background:var(--border);color:var(--text-faint);cursor:not-allowed;}

  .saved-flash{font-size:11px;color:var(--long);opacity:0;transition:opacity 0.3s;}
  .saved-flash.show{opacity:1;}

  .unassigned-list{display:flex;flex-direction:column;gap:8px;}
  .unassigned-item{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap;}
  .unassigned-item .login{font-family:'IBM Plex Mono',monospace;color:var(--text);width:80px;}
  .unassigned-item input{width:64px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;padding:5px 7px;}
  .unassigned-item select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;padding:5px 7px;}
  .empty-note{color:var(--text-dim);font-size:12.5px;}

  ::placeholder{color:var(--text-faint);}

  .sync-status{display:inline-block;font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px;padding:3px 8px;border-radius:2px;border:1px solid var(--border);color:var(--text-dim);}
  .sync-status.on{color:var(--long);border-color:var(--long);}
  .sync-status.off{color:var(--warn);border-color:var(--warn);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="titleblock">
      <h1>Book Exposure</h1>
      <div class="sub">Net position by symbol, weighted to cover — split by LP</div>
    </div>
    <div style="display:flex;align-items:flex-end;gap:16px;">
      <div style="text-align:right;font-size:12px;color:var(--text-dim);">
        <span id="syncStatus" class="sync-status"></span>
      </div>
      <div class="fileinfo" id="fileinfo">No file loaded yet</div>
      <label class="loadbtn" for="fileInput">Load positions file</label>
      <input type="file" id="fileInput" accept=".htm,.html">
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="exposure">Exposure</button>
    <button class="tab" data-tab="groups">Login Groups</button>
  </div>

  <div id="banner-slot"></div>

  <div id="tab-exposure"></div>
  <div id="tab-groups" style="display:none;"></div>

</div>

<!-- Groups are embedded into this file so they persist wherever it's opened.
     The download button rewrites this blob with your current groups.
     Each entry is { lp: "broctagon" | "fxgrow", pct: number }. -->
<script type="application/json" id="embeddedGroups">{}</script>

<script>
(function(){

  // ---------- shared sync config ----------
  // Fill these in with your Firebase Realtime Database project to sync login
  // groups across all devices. Create a free project at https://console.firebase.google.com
  // (Project settings → General → Your apps → Web app → copy the config). Then set
  // the Realtime Database security rules to allow reads/writes for anyone (see README).
  // Leave apiKey as "PASTE" to run in local-only mode.
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDCBscUj6TgtvcMnw6f7_96EMpmjBi4S88',
    authDomain: 'a2bexposure.firebaseapp.com',
    databaseURL: 'https://a2bexposure-default-rtdb.firebaseio.com',
    projectId: 'a2bexposure'
  };

  // Separate path from the original A2B-exposure- site (which uses 'loginGroups')
  // so the two sites never share or overwrite each other's saved groups.
  const DB_REF = 'loginGroupsBrocFxg';

  const LP_LIST = ['broctagon', 'fxgrow'];
  const LP_LABEL = { broctagon: 'Broctagon', fxgrow: 'FX Grow' };
  const LP_CHIP_LABEL = { broctagon: 'BRO', fxgrow: 'FXG' };

  let fbDatabase = null;      // initialized Firebase RTDB handle
  let fbInitialized = false;
  let fbApplied = false;      // guard: only apply initial snapshot once
  let suppressRemote = false; // true while we are writing, to ignore echoes

  function initFirebase(){
    if(!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PASTE')){
      return false;
    }
    if(fbInitialized) return true;
    try{
      if(typeof window.firebase === 'undefined') return false;
      window.firebase.initializeApp(FIREBASE_CONFIG);
      fbDatabase = window.firebase.database();
      fbInitialized = true;
      return true;
    }catch(e){
      console.error('Firebase init failed', e);
      return false;
    }
  }

  // ---------- state ----------
  let groupMap = {};          // { login: { lp: 'broctagon'|'fxgrow', pct: number } }
  let lastRows = [];          // parsed rows from most recent file: {login, symbol, side, volume}
  let lastFileMeta = null;    // {name, loadedAt}
  let currentTab = 'exposure';

  const els = {
    fileInput: document.getElementById('fileInput'),
    fileinfo: document.getElementById('fileinfo'),
    tabExposure: document.getElementById('tab-exposure'),
    tabGroups: document.getElementById('tab-groups'),
    bannerSlot: document.getElementById('banner-slot'),
    tabs: document.querySelectorAll('.tab'),
  };

  // Normalizes any shape of stored groups into { login: { lp, pct } }.
  // Also migrates the old format (a bare percent number per login, from before
  // LPs existed) by defaulting those logins to Broctagon — they'll show up
  // in the Login Groups tab so you can re-check/re-assign the LP.
  function normalizeGroupMap(map){
    const out = {};
    if(!map || typeof map !== 'object') return out;
    Object.entries(map).forEach(([login, v]) => {
      if(v && typeof v === 'object' && !Array.isArray(v)){
        const lp = LP_LIST.includes(v.lp) ? v.lp : 'broctagon';
        const pct = Number(v.pct);
        if(isFinite(pct)) out[login] = { lp, pct };
      }else{
        const pct = Number(v);
        if(isFinite(pct)) out[login] = { lp: 'broctagon', pct };
      }
    });
    return out;
  }

  // ---------- storage ----------
  // Use the hosting tool's `window.storage` API when present, otherwise fall
  // back to localStorage, and finally to an in-memory map — so groups can
  // always be added, even in a fully blocked/sandboxed environment.
  const memStore = {
    __data: {},
    getItem(k){ return k in this.__data ? this.__data[k] : null; },
    setItem(k, v){ this.__data[k] = String(v); },
    removeItem(k){ delete this.__data[k]; }
  };

  function getStore(){
    if(window.storage && typeof window.storage.get === 'function'){
      return window.storage;
    }
    try{
      if(typeof localStorage !== 'undefined'){
        // probe it — in sandboxed iframes accessing localStorage can throw
        const k = '__probe__';
        localStorage.setItem(k, '1');
        localStorage.removeItem(k);
        return localStorage;
      }
    }catch(e){
      /* localStorage blocked (e.g. sandboxed iframe) — fall through */
    }
    // last-resort in-memory store
    return memStore;
  }

  // Groups embedded directly into this HTML file (so they persist everywhere).
  function embeddedGroups(){
    const el = document.getElementById('embeddedGroups');
    if(!el) return {};
    try{
      const g = JSON.parse(el.textContent);
      return (g && typeof g === 'object' && !Array.isArray(g)) ? g : {};
    }catch(e){
      return {};
    }
  }

  async function loadGroupMap(){
    // 1. Start from whatever is baked into the file.
    let merged = embeddedGroups();
    // 2. If Firebase is configured, the shared cloud value is the source of truth
    //    (merged over the embedded baseline). A live listener keeps every open
    //    device in sync automatically.
    if(initFirebase()){
      try{
        const snap = await fbDatabase.ref(DB_REF).once('value');
        const val = snap.val();
        if(val && typeof val === 'object' && !Array.isArray(val)){
          merged = Object.assign(merged, val);
        }
        fbApplied = true;
        // Listen for changes made on OTHER devices and apply them live.
        fbDatabase.ref(DB_REF).on('value', (s) => {
          if(suppressRemote) return;
          const v = s.val();
          if(v && typeof v === 'object' && !Array.isArray(v)){
            groupMap = normalizeGroupMap(Object.assign(embeddedGroups(), v));
            refreshAll();
          }
        });
      }catch(e){
        console.error('Could not read groups from Firebase', e);
      }
    }
    // 3. Overlay with the most recent session storage (offline fallback).
    const store = getStore();
    if(store){
      try{
        let raw = null;
        if(store === window.storage){
          const res = await window.storage.get('login-groups', false);
          if(res && res.value) raw = res.value;
        }else if(typeof store.getItem === 'function'){
          raw = store.getItem('login-groups');
        }
        if(raw != null && raw !== ''){
          const parsed = JSON.parse(raw);
          if(parsed && typeof parsed === 'object' && !Array.isArray(parsed)){
            merged = Object.assign(merged, parsed);
          }
        }
      }catch(e){
        /* keep what we have */
      }
    }
    groupMap = normalizeGroupMap(merged);
  }

  async function saveGroupMap(){
    // Always keep the embedded blob in sync so a download reflects the truth.
    try{
      const el = document.getElementById('embeddedGroups');
      if(el) el.textContent = JSON.stringify(groupMap);
    }catch(e){ /* ignore */ }

    // Push to the shared cloud so every device sees the change.
    if(initFirebase()){
      suppressRemote = true;          // ignore our own echo
      try{
        await fbDatabase.ref(DB_REF).set(groupMap);
      }catch(e){
        console.error('Could not save groups to Firebase', e);
      }finally{
        suppressRemote = false;
      }
    }

    const store = getStore();
    if(!store){
      console.error('No storage backend available — cannot save groups.');
      return false;
    }
    try{
      if(store === window.storage){
        await window.storage.set('login-groups', JSON.stringify(groupMap), false);
      }else if(typeof store.setItem === 'function'){
        store.setItem('login-groups', JSON.stringify(groupMap));
      }else{
        return false;
      }
      return true;
    }catch(e){
      console.error('Storage error saving groups', e);
      return false;
    }
  }

  // Rewrites this file with the current groups embedded, so they persist on disk.
  // The blob node text is updated in the DOM first, then the serialized document
  // is written out — this avoids constructing script tag strings manually.
  function downloadWithGroups(){
    const el = document.getElementById('embeddedGroups');
    if(el){
      el.textContent = JSON.stringify(groupMap);
    }
    // Re-serialize the whole document with the updated embedded blob.
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (document.title || 'book-exposure').replace(/\s+/g, '-').toLowerCase() + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---------- file parsing ----------
  function decodeFile(buf){
    const bytes = new Uint8Array(buf);
    if(bytes[0]===0xFF && bytes[1]===0xFE){
      return new TextDecoder('utf-16le').decode(buf);
    }else if(bytes[0]===0xFE && bytes[1]===0xFF){
      return new TextDecoder('utf-16be').decode(buf);
    }
    return new TextDecoder('utf-8').decode(buf);
  }

  function parsePositions(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const trs = doc.querySelectorAll('tr');
    const rows = [];
    trs.forEach(tr => {
      const tds = tr.querySelectorAll('td');
      if(tds.length < 6) return;
      const login = tds[0].textContent.trim();
      const symbolRaw = tds[2].textContent.trim();
      const side = tds[4].textContent.trim().toLowerCase();
      const volumeRaw = tds[5].textContent.trim();
      if(!/^\d+$/.test(login)) return; // skip header / non-data rows
      if(side !== 'buy' && side !== 'sell') return;
      const volume = parseFloat(volumeRaw);
      if(!isFinite(volume)) return;
      const symbol = symbolRaw.replace(/-+$/,'');
      rows.push({ login, symbol, side, volume });
    });
    return rows;
  }

  // symbol -> { groups: { "lp|pct": net }, unassigned: net, netPosition: net, netCover: { broctagon, fxgrow } }
  function computeExposure(rows){
    const bySymbol = {};
    const loginsSeen = new Set();
    const unassignedLogins = new Set();

    rows.forEach(r => {
      loginsSeen.add(r.login);
      const signed = r.side === 'buy' ? r.volume : -r.volume;
      if(!bySymbol[r.symbol]){
        bySymbol[r.symbol] = { groups: {}, unassigned: 0, netPosition: 0, netCover: { broctagon: 0, fxgrow: 0 } };
      }
      const entry = bySymbol[r.symbol];
      entry.netPosition += signed;

      const g = groupMap[r.login];
      if(!g || !LP_LIST.includes(g.lp) || g.pct === undefined || g.pct === null || g.pct === ''){
        entry.unassigned += signed;
        unassignedLogins.add(r.login);
      }else{
        const key = g.lp + '|' + Number(g.pct);
        entry.groups[key] = (entry.groups[key] || 0) + signed;
      }
    });

    Object.values(bySymbol).forEach(entry => {
      const cover = { broctagon: 0, fxgrow: 0 };
      Object.entries(entry.groups).forEach(([key, net]) => {
        const [lp, p] = key.split('|');
        cover[lp] += net * (Number(p) / 100);
      });
      entry.netCover = cover;
    });

    return { bySymbol, loginsSeen, unassignedLogins };
  }

  // ---------- rendering: exposure tab ----------
  function fmt(n){
    const v = Math.round(n * 100) / 100;
    const sign = v > 0 ? '+' : '';
    return sign + v.toFixed(2);
  }

  function numClass(n){
    if(Math.abs(n) < 0.001) return 'zero';
    return n > 0 ? 'long' : 'short';
  }

  function renderBanner(unassignedLogins){
    if(!lastFileMeta){ els.bannerSlot.innerHTML=''; return; }
    if(unassignedLogins.size === 0){ els.bannerSlot.innerHTML=''; return; }
    els.bannerSlot.innerHTML = `
      <div class="banner">
        <span>${unassignedLogins.size} login${unassignedLogins.size>1?'s':''} in this file ${unassignedLogins.size>1?'have':'has'} no LP/group assigned — their volume is excluded from both cover totals.</span>
        <a data-goto="groups">Assign now →</a>
      </div>`;
    els.bannerSlot.querySelector('[data-goto]').addEventListener('click', () => switchTab('groups'));
  }

  function renderExposure(){
    if(!lastFileMeta){
      els.tabExposure.innerHTML = `
        <div class="empty">
          <div class="big">No positions loaded</div>
          <div>Load a Positions export from the MT5 manager to see net exposure by symbol.</div>
        </div>`;
      return;
    }

    const { bySymbol, loginsSeen, unassignedLogins } = computeExposure(lastRows);
    renderBanner(unassignedLogins);

    const symbols = Object.keys(bySymbol).sort((a,b) => {
      const totA = Math.abs(bySymbol[a].netCover.broctagon) + Math.abs(bySymbol[a].netCover.fxgrow);
      const totB = Math.abs(bySymbol[b].netCover.broctagon) + Math.abs(bySymbol[b].netCover.fxgrow);
      return totB - totA;
    });

    const totalLots = lastRows.reduce((s,r)=>s+r.volume,0);
    const totalCoverBro = symbols.reduce((s,sym)=>s+bySymbol[sym].netCover.broctagon,0);
    const totalCoverFxg = symbols.reduce((s,sym)=>s+bySymbol[sym].netCover.fxgrow,0);

    let html = `
      <div class="summary">
        <div class="cell"><div class="label">Symbols</div><div class="val">${symbols.length}</div></div>
        <div class="cell"><div class="label">Open lots</div><div class="val">${totalLots.toFixed(2)}</div></div>
        <div class="cell"><div class="label">Logins in file</div><div class="val">${loginsSeen.size}</div></div>
        <div class="cell"><div class="label">Unassigned logins</div><div class="val" style="${unassignedLogins.size?'color:var(--warn)':''}">${unassignedLogins.size}</div></div>
        <div class="cell"><div class="label">Net cover — Broctagon</div><div class="val num ${numClass(totalCoverBro)}">${fmt(totalCoverBro)}</div></div>
        <div class="cell"><div class="label">Net cover — FX Grow</div><div class="val num ${numClass(totalCoverFxg)}">${fmt(totalCoverFxg)}</div></div>
      </div>
      <table class="exposure-table">
        <thead><tr>
          <th style="width:13%;">Symbol</th>
          <th style="width:11%;">Net position</th>
          <th>Group breakdown</th>
          <th style="width:13%;text-align:right;">Net cover — Broctagon</th>
          <th style="width:13%;text-align:right;">Net cover — FX Grow</th>
        </tr></thead>
        <tbody>
    `;

    symbols.forEach(sym => {
      const e = bySymbol[sym];
      const keys = Object.keys(e.groups).sort((a,b) => {
        const [lpA, pA] = a.split('|');
        const [lpB, pB] = b.split('|');
        if(lpA !== lpB) return lpA.localeCompare(lpB);
        return Number(pA) - Number(pB);
      });
      let chips = keys.map(key => {
        const [lp, p] = key.split('|');
        return `
        <div class="chip lp-${lp}">
          <div class="pct">${LP_CHIP_LABEL[lp]} ${p}%</div>
          <div class="val ${numClass(e.groups[key])}">${fmt(e.groups[key])}</div>
        </div>`;
      }).join('');
      if(Math.abs(e.unassigned) > 0.001){
        chips += `
        <div class="chip unassigned">
          <div class="pct">unset</div>
          <div class="val ${numClass(e.unassigned)}">${fmt(e.unassigned)}</div>
        </div>`;
      }
      html += `
        <tr>
          <td class="symcell">${sym}</td>
          <td class="num ${numClass(e.netPosition)}">${fmt(e.netPosition)}</td>
          <td><div class="chips">${chips || '<span class="empty-note">—</span>'}</div></td>
          <td style="text-align:right;" class="cover-val ${numClass(e.netCover.broctagon)}">${fmt(e.netCover.broctagon)}</td>
          <td style="text-align:right;" class="cover-val ${numClass(e.netCover.fxgrow)}">${fmt(e.netCover.fxgrow)}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    els.tabExposure.innerHTML = html;
  }

  function lpSelectHtml(cls, selected){
    return `<select class="${cls}">` +
      LP_LIST.map(lp => `<option value="${lp}" ${lp===selected?'selected':''}>${LP_LABEL[lp]}</option>`).join('') +
      `</select>`;
  }

  // ---------- rendering: groups tab ----------
  function renderGroups(){
    // One unified table: every login currently in the loaded file, plus any
    // previously-saved login that isn't in this file (so you don't lose it).
    // Reload a fresh positions file every 10-15 min and this table just
    // updates in place — saved LP/% values carry over automatically.
    const currentLogins = [...new Set(lastRows.map(r=>r.login))];
    const savedElsewhere = Object.keys(groupMap).filter(l => !currentLogins.includes(l));
    const allLogins = [...currentLogins, ...savedElsewhere].sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));

    let rows = allLogins.map(login => {
      const g = groupMap[login];
      const lp = g ? g.lp : 'broctagon';
      const pct = (g && g.pct !== undefined) ? g.pct : '';
      const inFile = currentLogins.includes(login);
      return `
      <tr data-login="${login}">
        <td class="num">${login}${inFile ? '' : ' <span class="empty-note">(not in current file)</span>'}</td>
        <td>${lpSelectHtml('lp-select', lp)}</td>
        <td>
          <input type="number" class="pct-input" min="0" max="100" step="0.1" value="${pct}" placeholder="%">
        </td>
        <td class="row-actions">
          <button class="iconbtn save-row">Save</button>
          <button class="iconbtn danger del-row">Remove</button>
        </td>
      </tr>`;
    }).join('');

    els.tabGroups.innerHTML = `
      <div class="groups-wrap">
        <div class="panel">
          <div class="panel-head">
            <h3>Logins${allLogins.length ? ` — ${allLogins.length}` : ''}</h3>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="saved-flash" id="savedFlash">Saved</span>
              <button class="iconbtn" id="downloadBtn" title="Save groups into the file itself">Download file with saved groups</button>
            </div>
          </div>
          <div class="panel-body">
            <table class="groups-table">
              <thead><tr><th style="width:22%;">Login</th><th style="width:26%;">LP</th><th style="width:18%;">Group %</th><th>Actions</th></tr></thead>
              <tbody id="groupsBody">
                ${rows || `<tr><td colspan="4" class="empty-note" style="padding:14px 8px;">Load a positions file to see logins here, or add one below.</td></tr>`}
              </tbody>
            </table>
            <div class="add-row">
              <div class="field">
                <label>Add another login</label>
                <input type="text" id="newLogin" placeholder="e.g. 5220">
              </div>
              <div class="field">
                <label>LP</label>
                ${lpSelectHtml('', 'broctagon').replace('<select', '<select id="newLp"')}
              </div>
              <div class="field">
                <label>Group %</label>
                <input type="number" id="newPct" min="0" max="100" step="0.1" placeholder="30">
              </div>
              <button class="btn" id="addBtn">Add</button>
            </div>
          </div>
        </div>
      </div>
    `;

    wireGroupsEvents();
  }

  function flashSaved(){
    const el = document.getElementById('savedFlash');
    if(!el) return;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'), 900);
  }

  function wireGroupsEvents(){
    const body = document.getElementById('groupsBody');

    const dlBtn = document.getElementById('downloadBtn');
    if(dlBtn) dlBtn.addEventListener('click', downloadWithGroups);

    body.querySelectorAll('.save-row').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const tr = e.target.closest('tr');
        const login = tr.dataset.login;
        const lp = tr.querySelector('.lp-select').value;
        const val = tr.querySelector('.pct-input').value;
        if(val === '' || isNaN(Number(val))) return;
        groupMap[login] = { lp, pct: Number(val) };
        const ok = await saveGroupMap();
        if(ok){ flashSaved(); refreshAll(); }
      });
    });

    body.querySelectorAll('.del-row').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const tr = e.target.closest('tr');
        const login = tr.dataset.login;
        delete groupMap[login];
        const ok = await saveGroupMap();
        if(ok){ flashSaved(); refreshAll(); }
      });
    });

    const addBtn = document.getElementById('addBtn');
    addBtn.addEventListener('click', async () => {
      const loginInput = document.getElementById('newLogin');
      const lpInput = document.getElementById('newLp');
      const pctInput = document.getElementById('newPct');
      const login = loginInput.value.trim();
      const lp = lpInput ? lpInput.value : 'broctagon';
      const pct = pctInput.value;
      if(!login || pct === '' || isNaN(Number(pct))) return;
      groupMap[login] = { lp, pct: Number(pct) };
      loginInput.value = '';
      pctInput.value = '';
      const ok = await saveGroupMap();
      if(ok){ flashSaved(); refreshAll(); }
    });

  }

  // ---------- tabs ----------
  function switchTab(name){
    currentTab = name;
    els.tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    els.tabExposure.style.display = name === 'exposure' ? '' : 'none';
    els.tabGroups.style.display = name === 'groups' ? '' : 'none';
  }
  els.tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  function refreshAll(){
    updateSyncStatus();
    renderExposure();
    renderGroups();
  }

  function updateSyncStatus(){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    if(initFirebase()){
      el.textContent = '● Live sync — groups shared across devices';
      el.className = 'sync-status on';
    }else{
      el.textContent = '○ Local only — groups saved on this device';
      el.className = 'sync-status off';
    }
  }

  // ---------- file load ----------
  els.fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    els.fileinfo.innerHTML = 'Loading…';
    try{
      const buf = await file.arrayBuffer();
      const text = decodeFile(buf);
      const rows = parsePositions(text);
      lastRows = rows;
      lastFileMeta = { name: file.name, loadedAt: new Date() };
      els.fileinfo.innerHTML = `<b>${lastFileMeta.name}</b><br>loaded ${lastFileMeta.loadedAt.toLocaleTimeString()}`;
      refreshAll();
    }catch(err){
      console.error(err);
      els.fileinfo.innerHTML = 'Could not read that file';
    }
  });

  // ---------- init ----------
  (async function init(){
    await loadGroupMap();
    refreshAll();
  })();

})();
</script>
</body>
</html>
